plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lynxneedle.host'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lynxneedle.host'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'arm64-v8a' }
    }

    packagingOptions {
        // Both the Lynx SDK aars and our extracted copies may ship these.
        pickFirst '**/libnapi_adapter.so'
        pickFirst '**/libnapi.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/liblynx.so'
        pickFirst '**/liblynxtrace.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':lynx-needle-sdk')
    // 4.3.0 nightly: the first published Lynx build with NAPI binding enabled
    // (verified: NapiRuntimeProxy + attach logs present in liblynx.so).
    implementation 'org.lynxsdk.lynx:lynx:4.3.0-nightly.202609010611.167.g17ad2906-SNAPSHOT'
    implementation 'org.lynxsdk.lynx:lynx-service-log:4.3.0-nightly.202609010611.167.g17ad2906-SNAPSHOT'
    implementation 'org.lynxsdk.lynx:lynx-service-http:4.3.0-nightly.202609010611.167.g17ad2906-SNAPSHOT'
    // lynx-service-http declares okhttp as compileOnly
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // QR scanning for loading the dev-server bundle URL
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
