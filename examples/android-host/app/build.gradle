plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lynxneedle.host'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lynxneedle.host'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'arm64-v8a' }
    }

    packagingOptions {
        // Both the Lynx SDK aars and our extracted copies may ship these.
        pickFirst '**/libnapi_adapter.so'
        pickFirst '**/libnapi.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/liblynx.so'
        pickFirst '**/liblynxtrace.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':lynx-needle-sdk')
    implementation 'org.lynxsdk.lynx:lynx:3.9.1'
    implementation 'org.lynxsdk.lynx:lynx-service-log:3.9.1'
    implementation 'org.lynxsdk.lynx:lynx-service-http:3.9.1'
    // lynx-service-http declares okhttp as compileOnly
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.13.1'
}
