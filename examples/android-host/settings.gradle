pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // Lynx nightly snapshots (4.3.0-nightly.*) — first public artifacts
        // built with enable_napi_binding=true
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

rootProject.name = 'lynx-needle-host'
include ':app'
include ':lynx-needle-sdk'
project(':lynx-needle-sdk').projectDir = new File(rootDir, '../../android')
