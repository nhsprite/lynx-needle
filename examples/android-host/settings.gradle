pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

plugins {
    id 'org.lynxsdk.lynx.library-settings' version '4.3.0-nightly.202609080610.178.gcd26ecb7-SNAPSHOT'
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // Lynx nightly snapshots (4.3.0-nightly.*) — first public artifacts
        // built with enable_napi_binding=true
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

rootProject.name = 'lynx-needle-host'
include ':app'
