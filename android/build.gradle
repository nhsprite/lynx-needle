plugins {
    id 'com.android.library'
}

def primjsVersion = rootProject.findProperty('lynx.primjs.version') ?: '4.2.0-alpha.0-SNAPSHOT'

configurations {
    primjsNativeAar
}

def primjsNativeDir = layout.buildDirectory.dir('primjs-native')

tasks.register('extractPrimjsNativeLibraries', Sync) {
    from(configurations.primjsNativeAar.incoming.artifactView {}.files.collect { zipTree(it) })
    include 'jni/**/*.so'
    into primjsNativeDir
}

android {
    namespace 'com.lynxneedle.autolink'
    compileSdk 35

    defaultConfig {
        minSdk 23

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
                arguments "-DLYNX_PRIMJS_JNI_DIR=${primjsNativeDir.get().asFile.absolutePath}/jni"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.18.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = []
        }
    }
}

dependencies {
    implementation "org.lynxsdk.lynx:primjs:${primjsVersion}"
    primjsNativeAar "org.lynxsdk.lynx:primjs:${primjsVersion}@aar"
}

tasks.configureEach {
    if (name.startsWith('configureCMake')
        || name.startsWith('generateJsonModel')
        || name.startsWith('externalNativeBuild')) {
        dependsOn tasks.named('extractPrimjsNativeLibraries')
    }
}
