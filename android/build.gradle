plugins {
    id 'com.android.library'
}

android {
    namespace 'com.lynxneedle.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 24

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The host app provides the Lynx runtime at whatever version it chooses.
    compileOnly 'org.lynxsdk.lynx:lynx:3.9.1'
}
