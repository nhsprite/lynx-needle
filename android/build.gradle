plugins {
    id 'com.android.library'
}

android {
    namespace 'com.lynxneedle.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 24

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The host app provides the Lynx runtime at whatever version it chooses.
    // The NAPI addon flow requires a runtime with NAPI binding; the first such
    // published artifacts are the 4.3.0 nightlies (RuntimeLifecycleListener's
    // onRuntimeAttach(long, String) two-arg signature matches those).
    compileOnly 'org.lynxsdk.lynx:lynx:4.3.0-nightly.202609010611.167.g17ad2906-SNAPSHOT'
}
